<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexin2048 - Game Downloader</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #4a0000;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Fondo de ondas rojas (Animado) */
        .waves {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #ff1a1a 0%, #4a0000 100%);
            z-index: -1;
        }

        .waves::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'), 
                        linear-gradient(45deg, rgba(255,0,0,0.2) 25%, transparent 25%);
            animation: move 20s linear infinite;
            opacity: 0.3;
        }

        @keyframes move {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* El contenedor con bordes redondos */
        .glass-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 0, 0, 0.5);
            border-radius: 40px;
            padding: 60px;
            text-align: center;
            width: 450px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.3);
        }

        h1 {
            color: #ff4d4d;
            font-size: 32px;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        h2 { color: #ff9999; font-size: 14px; margin-bottom: 40px; letter-spacing: 2px; }

        input {
            width: 90%;
            padding: 15px;
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid #ff3333;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            outline: none;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Botón con luz verde y animación */
        button {
            width: 100%;
            padding: 20px;
            background: #ff4d4d;
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }

        button:hover {
            transform: scale(1.08); /* Se agranda un poco */
            background: #ff3333;
            box-shadow: 0 0 35px #00ff44; /* Luz verde neón al pasar el mouse */
        }

        #status { color: #ffcccc; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="waves"></div>

    <div class="glass-card">
        <h1>Flexin2048 - Game Downloader</h1>
        <h2>BY FLEXIN2048</h2>

        <input type="text" id="gameId" placeholder="Insert Game ID">
        <button onclick="download()">DOWNLOAD RBXM</button>

        <div id="status">Ready to scan...</div>

        <p style="color: rgba(255,255,255,0.3); font-size: 11px; margin-top: 50px;">
            © 2024 FLEXIN2048. ALL DOR RESERIVED
        </p>
    </div>

    <script>
        function download() {
            const id = document.getElementById('gameId').value;
            const status = document.getElementById('status');
            
            if(!id) {
                status.innerText = "Please enter an ID";
                return;
            }

            status.innerText = "Connecting to Roblox...";
            // Ejecuta la descarga
            window.location.href = `/api/download?id=${id}`;
            
            setTimeout(() => { status.innerText = "Processing File..."; }, 2000);
        }
    </script>
</body>
</html>
